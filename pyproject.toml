[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mystock"
version = "0.1.0"
description = "AI-assisted quant research toolkit"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pyyaml",
    "python-dotenv",
    "akshare",
    "pandas",
    "pyarrow",
    "duckdb",
    "exchange-calendars",
    "vectorbt",
    "quantstats-reloaded",
    "plotly",
    "pydantic",
    "openai",
    "socksio",
    "lightgbm",
    "pyqlib",
    "jqdatasdk",
]

[project.scripts]
mystock = "cli:app"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
