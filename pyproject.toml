[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mystock"
version = "0.1.0"
description = "Quantitative research toolkit — data acquisition CLI (Phase 1)"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pyyaml",
    "python-dotenv",
]

[project.scripts]
mystock = "mystock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
