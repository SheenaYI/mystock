[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mystock"
version = "0.1.0"
description = "Quantitative research toolkit — data acquisition CLI"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pyyaml",
    "python-dotenv",
    "akshare",
    "pandas",
    "pyarrow",
    "duckdb",
]

[project.scripts]
mystock = "cli:app"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
